<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Roboto,Arial,sans-serif;background:#cfd4d9;width:max-content;display:flex;gap:56px;padding:64px;align-items:flex-start}
.phone{flex:none;width:412px;min-width:412px;height:915px;background:#f7f7f7;position:relative;overflow:hidden;display:flex;flex-direction:column}
.phone.long{height:auto}
.sb{height:24px;flex:none;background:#00447f;color:#fff;font-size:12px;display:flex;justify-content:space-between;align-items:center;padding:0 14px}
.canvas{flex:1;position:relative;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow:hidden;min-height:0}
.header{height:58px;flex:none;background:#fff;display:flex;align-items:center;padding:0 16px;box-shadow:0 2px 3px rgba(0,0,0,.10);position:relative;z-index:2}
.hl{font-size:24px;font-weight:300;color:#2f3a43}
.hb{font-size:19.5px;font-weight:700;color:#2f3a43;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.div{height:1px;flex:none;background:#e3e5e7;margin:0 9px}
.tabbar{height:65px;flex:none;background:#fff;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px}
.ti{position:relative;width:35px;height:31px;display:flex;align-items:center;justify-content:center}
.badge{position:absolute;top:0;right:0;width:18px;height:18px;border-radius:9px;background:#f7941d;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.chip{position:absolute;right:13px;width:203px;height:74px;border-radius:19px;background:linear-gradient(135deg,#ecf6ff,#cde5fc);border:1px solid #96c6f3;overflow:visible;animation:bob 2.4s ease-in-out infinite;box-shadow:0 6px 14px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 18px;z-index:5}
.c1{height:27px;line-height:27px;font-size:15.6px;font-weight:700;color:#0059aa;white-space:pre}
.c2{height:20px;line-height:20px;font-size:11.5px;color:#2b3a4a}
.sl{position:absolute;left:-3px;top:-12px;font-size:19px;color:#2e96f0;animation:tw 1.65s infinite} .sr{position:absolute;right:-4px;top:-10px;font-size:13px;color:#6ebefa;animation:tw 2.27s .4s infinite}
.sb2{position:absolute;right:22px;bottom:-7px;font-size:11px;color:#2e96f0;animation:tw 1.9s .9s infinite}
.glint{position:absolute;inset:0;border-radius:19px;overflow:hidden;pointer-events:none}
.glint::after{content:"";position:absolute;top:-20px;left:0;width:46px;height:120px;transform:translateX(-70px) rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:sweep 3.2s cubic-bezier(.6,0,.4,1) infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -10px}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(45deg)}}
@keyframes sweep{to{transform:translateX(250px) rotate(18deg)}}
.top{background:#fff;box-shadow:0 3px 5px rgba(0,0,0,.09);position:relative}
.brand{display:flex;align-items:center;padding:14px 16px 6px}
.city{display:flex;align-items:center;font-size:19px;color:#000}
.search{margin:12px 16px 16px;height:56px;background:#fff;border:1px solid #ecedee;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.10);display:flex;align-items:center;padding:3px 14px 3px 16px}
.hint{flex:1;padding-left:12px;font-size:16px;color:#aaaeb2}
.chips{display:flex;gap:12px;padding:2px 14px 4px;white-space:nowrap}
.chipc{height:52px;display:flex;align-items:center;padding:0 20px 0 18px;background:#fff;border:1px solid #e8e9ea;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.10);font-size:17px;font-weight:700;color:#1e1e1e;flex:none;gap:14px}
.stories{display:flex;gap:6px;padding:0 12px}
.story{width:110px;height:136px;flex:none;padding:4px;border-radius:12px;background:#fff;border:3px solid transparent}
.story.new{border-color:#f69a25}
.story img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.banner{margin:8px 16px 16px;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.14)}
.banner img{width:100%;display:block}
.sec{display:flex;align-items:center;padding:24px 16px 16px;font-size:25px;font-weight:700;color:#14181c}
.sec>span:first-child{flex:1} .all{font-size:18px;font-weight:400;display:flex;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;row-gap:12px;padding:6px 16px 12px}
.card{background:#fff;padding-bottom:12px} .info{padding:10px 10px 0}
.ph{height:184px;padding:6px;background:#fff} .ph img{width:100%;height:100%;object-fit:contain;display:block}
.ct{display:flex;align-items:flex-start;font-size:16px;line-height:1.3;color:#1e2226;height:62px}
.ct span{flex:1;margin-right:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pr{margin-top:8px;height:26px;display:flex;align-items:center;font-size:17px;color:#2e3f4e} .op{height:20px} .pr small{font-size:13.3px;color:#5a6066}
.btn{margin-top:10px;height:42px;background:#0063ae;color:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px}
.tiles{display:grid;grid-template-columns:1fr 1fr;column-gap:26px;row-gap:26px;padding:0 13px 26px}
.tile{height:212px;background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.14);padding:18px 8px 8px 18px;display:flex;flex-direction:column}
.tile b{font-size:20px;color:#000;height:62px;line-height:1.2}
.tp{flex:1;margin-left:40px;display:flex;justify-content:flex-end;align-items:flex-end;min-height:0}
.tp img{max-width:100%;max-height:100%;display:block}
.gal{width:48px;height:48px;border:2px solid #b8bcc0;border-radius:4px;margin:auto}
.small{font-size:13px;color:#888;padding:8px 15px 8px 18px}
.outline{margin:0 16px 24px;height:42px;background:#fff;border:1px solid #e5e7e8;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#0063ae}
.sortbar{display:flex;background:#fff;border-bottom:1px solid #e5e7e8}
.sortbar>div{flex:1;height:52px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;color:#2e3f4e}
.sortbar .sep{flex:none;width:1px;background:#e5e7e8}
.pimg{height:350px;padding:16px 0;background:#fff} .pimg img{height:100%;display:block;margin:auto}
.pinfo{background:#f7f7f7;padding-top:18px}
.art{font-size:15px;color:#969ba0;padding-left:16px}
.ptitle{font-size:23px;color:#3c4248;padding:12px 16px 8px;line-height:1.3}
.pprice{font-size:27px;color:#000;padding:12px 0 16px 16px} .pprice small{font-size:21px;color:#5a6066}
.acts{display:flex;gap:14px;padding:0 16px}
.act{flex:1;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:18px}
.seg{margin:18px 16px 8px;height:56px;background:#ecedee;border-radius:10px;padding:3px;display:flex}
.seg div{flex:1;display:flex;align-items:center;justify-content:center;font-size:18px;color:#1e2226;border-radius:8px}
.seg .on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.dh{font-size:18px;font-weight:700;color:#2e3f4e;padding:10px 16px} .dt{font-size:15px;color:#2e3f4e;padding:0 16px 18px}
.dn{font-size:12px;color:#888;padding:5px 16px 25px}
.promo{display:flex;padding:24px 24px 10px}
.promo .f{flex:1;height:52px;background:#e6e8ea;border-radius:4px 0 0 4px;display:flex;align-items:center;padding-left:32px;font-size:17px;color:#6e747a}
.promo .b{width:176px;height:52px;background:#0063ae;border-radius:0 4px 4px 0;color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center}
.citem{margin:9px 12px;height:167px;overflow:hidden}
.cdet{width:388px;height:166px;background:#fff;border:1px solid #e5e7e8;border-radius:9px;display:flex;align-items:center;padding:8px 8px 8px 10px}
.cph{width:104px;height:134px;flex:none;display:flex;align-items:center} .cph img{width:100%;display:block}
.cright{flex:1;padding-left:8px}
.ctit{height:65px;font-size:14px;color:#444;display:flex;align-items:center}
.cpr{height:35px;font-size:17px;font-weight:700;color:#2e3f4e;display:flex;align-items:center}
.qty{display:flex;align-items:center}
.qty i{width:35px;height:36px;background:#2d84ba;color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:15px}
.qty span{width:48px;text-align:center;font-size:15px;color:#2e3f4e}
.foot{flex:none;background:#2e3e50;padding:14px 24px 16px;color:#fff}
.foot .r{display:flex;justify-content:space-between;align-items:center;height:30px;font-size:17px}
.foot .t{height:38px;font-size:22px;font-weight:700}
.foot .go{margin-top:12px;height:58px;background:#0063ae;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px}
.empty{text-align:center;padding-top:96px}
.empty h2{font-size:25px;color:#2e3f4e;padding:0 18px 12px}
.empty p{font-size:16px;color:#282c30;line-height:1.4}
.empty .eb{display:inline-flex;margin:22px 0 48px;height:56px;padding:0 26px;background:#0063ae;color:#fff;border-radius:6px;align-items:center;font-size:17px;font-weight:700}
.rooms{display:flex;gap:8px;padding:4px 8px 10px;white-space:nowrap;overflow:hidden}
.room{flex:none;height:40px;padding:0 16px;display:flex;align-items:center;font-size:13.5px;font-weight:700;color:#2b3a46;background:#fff;border:1px solid #e3e5e7;border-radius:6px}
.room.on{background:#0059aa;border-color:#0059aa;color:#fff}

body{background:#f7f7f7;padding:0;display:block;width:auto} .stage{position:relative;width:412px;height:260px;margin:40px auto;background:#fff;border:1px solid #e3e5e7}</style></head>
<body><div class="stage"><div class="chip" style="bottom:40px"><div class="c1">✦  Новые функции  ✦</div><div class="c2">Откройте цифровой дом</div><i class="glint"></i><span class="sl">✧</span><span class="sr">✦</span><span class="sb2">✦</span></div></div></body></html>
