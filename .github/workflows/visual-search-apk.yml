name: Verify photo SKU search Android
on:
  push:
    branches: [feat/visual-catalog-sku-ranking]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p android_companion :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: oma-visual-search-branch-apk
          path: android_companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
