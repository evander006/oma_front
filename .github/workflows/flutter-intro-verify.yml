name: Temporary Flutter onboarding verification
on:
  push:
    branches:
      - feat/flutter-launch-intro-20261028
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter-intro-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis (existing warnings are nonfatal)
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Onboarding and existing widget tests
        run: flutter test --no-pub test/launch_intro_test.dart test/widget_test.dart
      - name: Full Flutter test suite
        run: flutter test --no-pub
