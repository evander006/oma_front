name: Build OMA Digital Home unified demo APK
on:
  workflow_dispatch:
  push:
    branches:
      - codex/oma-unified-demo
    paths:
      - 'android_companion/**'
      - '.github/workflows/companion-android.yml'
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p android_companion :app:assembleDebug --no-daemon
      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: oma-unified-demo-debug-apk
          path: android_companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
